import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.alexmercerind.media_kit_libs_android_video'
    compileSdkVersion 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        minSdkVersion 16
    }
}

// The default flavor omits the pgssub decoder; full retains bitmap subtitles.
def release = 'v1.1.11'
def checksums = [
    'arm64-v8a': 'cdb54c5cf24725623ca717bbbd6d991031d625a377460bd128f19c2dffe189bd',
    'armeabi-v7a': 'b658f2ff91169f8dad0e09e0240ebe200bb3df999da5712f8fab96ad11a4fbec',
    'x86_64': '848936cfd7333077f21759adaca4a9e1a5647891da2e42ab211c5bdc30f4535d',
    'x86': '8b3b84e54ec09bb79972095dc04bcaf651294da4e73b1e7c3251055fd8a2b901',
]
def outputDir = layout.buildDirectory.dir("libmpv-full/${release}")
def libraries = checksums.keySet().collect { abi ->
    outputDir.map { directory -> directory.file("full-${abi}.jar") }
}
def downloadDependencies = tasks.register('downloadDependencies') {
    inputs.property('checksums', checksums)
    outputs.files(libraries)
    doLast {
        checksums.each { abi, expected ->
            def destination = outputDir.get().file("full-${abi}.jar").asFile
            def digest = { file ->
                MessageDigest.getInstance('SHA-256').digest(Files.readAllBytes(file.toPath())).encodeHex().toString()
            }
            if (!destination.isFile() || digest(destination) != expected) {
                destination.parentFile.mkdirs()
                def url = "https://github.com/media-kit/libmpv-android-video-build/releases/download/${release}/${destination.name}"
                destination.withOutputStream { output ->
                    new URL(url).withInputStream { input -> output << input }
                }
            }
            if (digest(destination) != expected) {
                throw new GradleException("libmpv SHA-256 verification failed: ${destination.name}")
            }
        }
    }
}

dependencies {
    implementation(files(downloadDependencies))
}
