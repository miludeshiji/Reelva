name: reelva
description: "Reelva - modern cross-platform media player."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  cached_network_image: ^3.4.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  window_manager: ^0.5.2
  path: ^1.9.1
  path_provider: ^2.1.6
  xml: ^7.0.1
  dart_smb2: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.35.1
flutter:
  uses-material-design: true
  assets:
    - assets/Reelva.svg
    - assets/tmdb.svg
    - assets/licenses/libsmb2.txt
    - assets/fonts/NotoSansCJKsc-Regular.otf
    - assets/licenses/NotoSansCJK.txt
